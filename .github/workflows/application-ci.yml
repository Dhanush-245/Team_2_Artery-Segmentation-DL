name: application-ci

on:
  push:
    branches: [lingareddy-dhanush, review]
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PDF conversion dependency
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install backend dependencies
        run: pip install -r backend/requirements-ai.txt
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Deployment contract
        run: python -m json.tool railway.json >/dev/null && sh -n deploy/start.sh

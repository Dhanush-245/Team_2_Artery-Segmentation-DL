name: application-ci

on:
  push:
    branches: [lingareddy-dhanush, review]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PDF conversion dependency
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install backend dependencies
        run: pip install -r backend/requirements-ai.txt ruff==0.6.9
      - name: Backend lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 backend
      - name: Frontend build (type check + bundle)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: End-to-end tests (fresh database, seeded demo accounts)
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
          STORAGE_DIR: ${{ runner.temp }}/e2e-storage
          DEMO_CREDENTIALS_PATH: ${{ runner.temp }}/demo-credentials.json
          COROVISION_ENV: development
          COROVISION_MODEL_PROVIDER: legacy
          COROVISION_INFERENCE_WORKER: '0'
          CORS_ORIGINS: http://127.0.0.1:8010
          FRONTEND_ORIGIN: http://127.0.0.1:8010
          E2E_BASE_URL: http://127.0.0.1:8010
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          (cd backend && python seed_demo_accounts.py)
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > "$RUNNER_TEMP/e2e-server.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8010/api/health && break; sleep 2; done
          cd frontend && npx playwright install --with-deps chromium && npx playwright test
      - name: End-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Deployment contract
        run: python -m json.tool railway.json >/dev/null && sh -n deploy/start.sh

  container:
    runs-on: ubuntu-latest
    needs: application
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t corovision-ci:${{ github.sha }} .
      - name: Smoke test container readiness
        run: |
          docker run -d --name cv -e JWT_SECRET="$(openssl rand -hex 32)" -p 8000:8000 corovision-ci:${{ github.sha }}
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health/ready && exit 0; sleep 3; done
          docker logs cv; exit 1
      # Trivy runs from its pinned official image; the setup action's binary
      # download proved unreliable on hosted runners.
      - name: Vulnerability scan (fail on fixable critical findings)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress --timeout 20m \
            corovision-ci:${{ github.sha }}
      - name: Vulnerability report (high and critical, informational)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress --timeout 20m \
            corovision-ci:${{ github.sha }}
